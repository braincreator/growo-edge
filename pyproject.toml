[project]
name = "growo-edge"
version = "0.1.0"
description = "Growo Edge SDK — клиентский клей для внедрений: amoCRM, Avito, RAG-каналы. Исходники передаваемые."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
